<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chá Revelação - Lorena ou Rafael</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e9d8f4 0%, #e2f0d9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 30px;
      border: 3px solid #b5a4d2;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 2rem;
      color: #7b4397;
      margin-bottom: 5px;
    }

    .title .green {
      color: #558b2f;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 15px;
    }

    .info-box {
      background-color: #f9f6fc;
      border-left: 5px solid #8e24aa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
    }

    .info-box strong {
      color: #558b2f;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #444;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #8e24aa;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .radio-option {
      flex: 1;
      text-align: center;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .radio-option input[value="Sim"]:checked + label {
      background-color: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }

    .radio-option input[value="Não"]:checked + label {
      background-color: #ffebee;
      border-color: #ef5350;
      color: #c62828;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #8e24aa, #558b2f);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: opacity 0.3s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .success-message {
      display: none;
      text-align: center;
      padding: 20px;
      background-color: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">Chá da Lorena <span class="green">OU</span> Rafael</h1>
      <p class="subtitle">Será que vem uma Princesa ou Príncipe?</p>
    </div>

    <div class="info-box">
      <p>📅 <strong>Data:</strong> 03/10/2026 (Sábado)</p>
      <p>⏰ <strong>Horário:</strong> 15 Horas</p>
      <p>📍 <strong>Local:</strong> Condomínio Recanto Verde, Estrada do Realengo, 1017</p>
      <p>🥤 <i>Fique à vontade para trazer seu Open Cooler com sua bebida favorita!</i></p>
    </div>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" required placeholder="(21) 99999-9999">
      </div>

      <div class="form-group">
        <label>Você vai ao evento?</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="vou" name="presenca" value="Sim" required>
            <label for="vou">Eu vou! 🎉</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="naoVou" name="presenca" value="Não">
            <label for="naoVou">Eu não vou 😢</label>
          </div>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Confirmar Resposta</button>
    </form>

    <div id="successMessage" class="success-message">
      Obrigado! Sua resposta foi salva na nossa lista!
    </div>
  </div>

  <script>
    const API_URL = "/api/rsvp";

    const form = document.getElementById('rsvpForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const successMsg = document.getElementById('successMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      btnSubmit.innerText = "Enviando...";
      btnSubmit.disabled = true;

      const resposta = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        confirmado: document.querySelector('input[name="presenca"]:checked').value
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(resposta)
      })
      .then(async (response) => {
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `Erro HTTP ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        console.log('RSVP salvo com id:', data.id);
        form.reset();
        form.style.display = 'none';
        successMsg.style.display = 'block';
      })
      .catch(error => {
        alert('Ocorreu um erro ao enviar: ' + error.message);
        btnSubmit.innerText = "Confirmar Resposta";
        btnSubmit.disabled = false;
        console.error(error);
      });
    });
  </script>
</body>
</html>
